<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="app" class="mx-auto max-w-4xl px-4 py-8">
    <h1 class="mb-2 text-3xl font-bold">Device Board</h1>
    <div class="mb-3 text-sm text-gray-600">
      <div>Total Devices: {{ totalDevices }}</div>
      <div>Ignored Devices: {{ ignoredCount }}</div>
    </div>
    <div class="mb-2 flex justify-end">
      <label class="flex cursor-pointer items-center gap-2 text-sm text-gray-700">
        <span>Show Ignored</span>
        <input type="checkbox" v-model="showIgnored" class="h-4 w-4 accent-gray-900" />
      </label>
    </div>
    <div class="overflow-x-auto rounded-lg border border-gray-300 bg-white">
      <table class="w-full border-collapse">
        <thead>
          <tr>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">
              <button class="text-gray-400 hover:text-white" @click="toggleIgnoredSort" aria-label="Sort by ignored status">
                <i v-if="ignoredSort === 'asc'" class="fa-solid fa-sort-up"></i>
                <i v-else-if="ignoredSort === 'desc'" class="fa-solid fa-sort-down"></i>
                <i v-else class="fa-solid fa-sort"></i>
              </button>
            </th>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Device Name</th>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Integration</th>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Floor/Area</th>
          </tr>
        </thead>
        <tbody>
          <tr v-if="loading" class="odd:bg-white even:bg-gray-100">
            <td colspan="4" class="border-b border-gray-300 px-4 py-3">Loading devices…</td>
          </tr>
          <tr v-else-if="error" class="odd:bg-white even:bg-gray-100 text-red-600">
            <td colspan="4" class="border-b border-gray-300 px-4 py-3">{{ error }}</td>
          </tr>
          <tr v-else-if="!visibleDevices.length" class="odd:bg-white even:bg-gray-100">
            <td colspan="4" class="border-b border-gray-300 px-4 py-3">No devices found</td>
          </tr>
          <tr v-for="device in visibleDevices" v-else :key="device.id"
              class="odd:bg-white even:bg-gray-100 cursor-pointer hover:bg-gray-200"
              :class="{ 'text-gray-400 italic': device.is_ignored }"
              @click="selected = device">
            <td class="border-b border-gray-300 px-4 py-3 text-center">
              <i v-if="device.is_ignored" class="fa-solid fa-ban text-red-500"></i>
            </td>
            <td class="border-b border-gray-300 px-4 py-3">{{ device.name }}</td>
            <td class="border-b border-gray-300 px-4 py-3">{{ device.integration_name }}</td>
            <td class="border-b border-gray-300 px-4 py-3">{{ device.floor_name }} / {{ device.area_name }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <device-modal v-if="selected" :device="selected" @close="selected = null" @ignore="onIgnore" @include="onInclude" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, computed, onMounted, onBeforeUnmount } = Vue;

    const DeviceModal = {
      props: {
        device: { type: Object, required: true },
      },
      emits: ["close", "ignore", "include"],
      setup(props, { emit }) {
        const onKeydown = (e) => {
          if (e.key === "Escape") emit("close");
        };
        const openDevicePage = () => {
          window.location.href = `/config/devices/device/${props.device.id}`;
        };
        const onIncludedChange = (e) => {
          emit(e.target.checked ? "include" : "ignore");
        };
        onMounted(() => window.addEventListener("keydown", onKeydown));
        onBeforeUnmount(() => window.removeEventListener("keydown", onKeydown));
        return { openDevicePage, onIncludedChange };
      },
      template: `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click="$emit('close')">
          <div class="w-full max-w-md rounded-lg bg-white shadow-xl" @click.stop>
            <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
              <h2 class="text-lg font-semibold">{{ device.name }}</h2>
              <button class="text-xl leading-none text-gray-400 hover:text-gray-600" @click="$emit('close')" aria-label="Close">&times;</button>
            </div>
            <dl class="px-5 py-4">
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Device ID</dt>
                <dd class="break-all text-right font-medium">{{ device.id }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Integration</dt>
                <dd class="break-all text-right font-medium">{{ device.integration_name }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Floor</dt>
                <dd class="break-all text-right font-medium">{{ device.floor_name }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Area</dt>
                <dd class="break-all text-right font-medium">{{ device.area_name }}</dd>
              </div>
              <div class="flex items-center justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Included</dt>
                <dd class="text-right">
                  <input type="checkbox" :checked="!device.is_ignored" @change="onIncludedChange" class="h-4 w-4 accent-gray-900" />
                </dd>
              </div>
            </dl>
            <div class="flex justify-end border-t border-gray-200 px-5 py-4">
              <button class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-500" @click="openDevicePage">Open Device Page</button>
            </div>
          </div>
        </div>
      `,
    };

    createApp({
      components: { DeviceModal },
      setup() {
        const devices = ref([]);
        const showIgnored = ref(false);
        const ignoredSort = ref(null);
        const loading = ref(true);
        const error = ref("");
        const selected = ref(null);

        const toggleIgnoredSort = () => {
          ignoredSort.value =
            ignoredSort.value === "asc" ? "desc" : "asc";
        };

        const visibleDevices = computed(() => {
          const list = showIgnored.value
            ? [...devices.value]
            : devices.value.filter((d) => !d.is_ignored);
          if (ignoredSort.value === "asc") {
            list.sort((a, b) => Number(a.is_ignored) - Number(b.is_ignored));
          } else if (ignoredSort.value === "desc") {
            list.sort((a, b) => Number(b.is_ignored) - Number(a.is_ignored));
          }
          return list;
        });

        const totalDevices = computed(() => devices.value.length);
        const ignoredCount = computed(() =>
          devices.value.filter((d) => d.is_ignored).length
        );

        onMounted(async () => {
          try {
            const devRes = await fetch("{{BASE}}/api/devices");
            if (!devRes.ok) {
              const data = await devRes.json().catch(() => null);
              throw new Error(data?.detail || `Request failed (${devRes.status})`);
            }
            devices.value = await devRes.json();
          } catch (err) {
            error.value = err.message || "Failed to load devices";
          } finally {
            loading.value = false;
          }
        });

        const onIgnore = async () => {
          const device = selected.value;
          const res = await fetch(
            `{{BASE}}/api/devices/${device.id}/ignore`,
            { method: "POST" }
          );
          if (!res.ok) {
            error.value = "Failed to ignore device";
            return;
          }
          device.is_ignored = true;
          selected.value = null;
        };

        const onInclude = async () => {
          const device = selected.value;
          const res = await fetch(
            `{{BASE}}/api/devices/${device.id}/include`,
            { method: "POST" }
          );
          if (!res.ok) {
            error.value = "Failed to include device";
            return;
          }
          device.is_ignored = false;
          selected.value = null;
        };

        return { devices, showIgnored, ignoredSort, toggleIgnoredSort, totalDevices, ignoredCount, visibleDevices, loading, error, selected, onIgnore, onInclude };
      },
    }).mount("#app");
  </script>
</body>
</html>
