<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="py-4">
  <div class="container">
    <h1 class="mb-4">Device Board</h1>
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">Device Name</th>
            <th scope="col">Integration</th>
            <th scope="col">Floor/Area</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Living Room Light</td>
            <td>Philips Hue</td>
            <td>1st Floor / Living Room</td>
          </tr>
          <tr>
            <td>Front Door Lock</td>
            <td>Yale</td>
            <td>1st Floor / Entry</td>
          </tr>
          <tr>
            <td>Bedroom Thermostat</td>
            <td>Ecobee</td>
            <td>2nd Floor / Bedroom</td>
          </tr>
          <tr>
            <td>Kitchen Outlet</td>
            <td>Shelly</td>
            <td>1st Floor / Kitchen</td>
          </tr>
          <tr>
            <td>Garage Camera</td>
            <td>Ring</td>
            <td>Ground / Garage</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
