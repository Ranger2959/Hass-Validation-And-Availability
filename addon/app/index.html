<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="app" class="mx-auto max-w-4xl px-4 py-8">
    <h1 class="mb-2 text-3xl font-bold">Device Board</h1>
    <div class="mb-4 flex gap-6 border-b border-gray-200">
      <button
        v-for="tab in tabs"
        :key="tab"
        class="-mb-px border-b-2 px-1 pb-2 text-sm font-medium"
        :class="activeTab === tab ? 'border-gray-900 text-gray-900' : 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700'"
        @click="activeTab = tab"
      >{{ tab }}</button>
    </div>
    <component :is="tabComponents[activeTab]"></component>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script>window.APP_BASE = "{{BASE}}";</script>
  <script src="api.js"></script>
  <script src="device-modal.js"></script>
  <script src="devices-tab.js"></script>
  <script src="cache-modal.js"></script>
  <script src="settings-tab.js"></script>
  <script src="app.js"></script>
</body>
</html>
