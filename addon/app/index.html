<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="app" class="mx-auto max-w-4xl px-4 py-8">
    <h1 class="mb-6 text-3xl font-bold">Device Board</h1>
    <div class="mb-2 flex justify-end">
      <label class="flex cursor-pointer items-center gap-2 text-sm text-gray-700">
        <span>Show Ignored</span>
        <input type="checkbox" v-model="showIgnored" class="h-4 w-4 accent-gray-900" />
      </label>
    </div>
    <div class="overflow-x-auto rounded-lg border border-gray-300 bg-white">
      <table class="w-full border-collapse">
        <thead>
          <tr>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Device Name</th>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Integration</th>
            <th class="bg-gray-900 px-4 py-3 text-left text-white">Floor/Area</th>
          </tr>
        </thead>
        <tbody>
          <tr v-if="loading" class="odd:bg-white even:bg-gray-100">
            <td colspan="3" class="border-b border-gray-300 px-4 py-3">Loading devices…</td>
          </tr>
          <tr v-else-if="error" class="odd:bg-white even:bg-gray-100 text-red-600">
            <td colspan="3" class="border-b border-gray-300 px-4 py-3">{{ error }}</td>
          </tr>
          <tr v-else-if="!visibleDevices.length" class="odd:bg-white even:bg-gray-100">
            <td colspan="3" class="border-b border-gray-300 px-4 py-3">No devices found</td>
          </tr>
          <tr v-for="device in visibleDevices" v-else :key="device.id"
              class="odd:bg-white even:bg-gray-100 cursor-pointer hover:bg-gray-200"
              @click="selected = device">
            <td class="border-b border-gray-300 px-4 py-3">{{ device.name }}</td>
            <td class="border-b border-gray-300 px-4 py-3">{{ device.integration_name }}</td>
            <td class="border-b border-gray-300 px-4 py-3">{{ device.floor_name }} / {{ device.area_name }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <device-modal v-if="selected" :device="selected" @close="selected = null" @ignore="onIgnore" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, computed, onMounted, onBeforeUnmount } = Vue;

    const DeviceModal = {
      props: {
        device: { type: Object, required: true },
      },
      emits: ["close", "ignore"],
      setup(props, { emit }) {
        const onKeydown = (e) => {
          if (e.key === "Escape") emit("close");
        };
        onMounted(() => window.addEventListener("keydown", onKeydown));
        onBeforeUnmount(() => window.removeEventListener("keydown", onKeydown));
      },
      template: `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click="$emit('close')">
          <div class="w-full max-w-md rounded-lg bg-white shadow-xl" @click.stop>
            <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
              <h2 class="text-lg font-semibold">{{ device.name }}</h2>
              <button class="text-xl leading-none text-gray-400 hover:text-gray-600" @click="$emit('close')" aria-label="Close">&times;</button>
            </div>
            <dl class="px-5 py-4">
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Device ID</dt>
                <dd class="break-all text-right font-medium">{{ device.id }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Integration</dt>
                <dd class="break-all text-right font-medium">{{ device.integration_name }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Floor</dt>
                <dd class="break-all text-right font-medium">{{ device.floor_name }}</dd>
              </div>
              <div class="flex justify-between gap-4 border-b border-gray-100 py-2 last:border-0">
                <dt class="shrink-0 text-gray-500">Area</dt>
                <dd class="break-all text-right font-medium">{{ device.area_name }}</dd>
              </div>
            </dl>
            <div class="flex justify-end border-t border-gray-200 px-5 py-4">
              <button class="rounded-md bg-red-600 px-4 py-2 font-medium text-white hover:bg-red-500" @click="$emit('ignore')">Ignore</button>
            </div>
          </div>
        </div>
      `,
    };

    createApp({
      components: { DeviceModal },
      setup() {
        const devices = ref([]);
        const showIgnored = ref(false);
        const loading = ref(true);
        const error = ref("");
        const selected = ref(null);

        const visibleDevices = computed(() =>
          showIgnored.value
            ? devices.value
            : devices.value.filter((d) => !d.is_ignored)
        );

        onMounted(async () => {
          try {
            const devRes = await fetch("{{BASE}}/api/devices");
            if (!devRes.ok) {
              const data = await devRes.json().catch(() => null);
              throw new Error(data?.detail || `Request failed (${devRes.status})`);
            }
            devices.value = await devRes.json();
          } catch (err) {
            error.value = err.message || "Failed to load devices";
          } finally {
            loading.value = false;
          }
        });

        const onIgnore = async () => {
          const device = selected.value;
          const res = await fetch(
            `{{BASE}}/api/devices/${device.id}/ignore`,
            { method: "POST" }
          );
          if (!res.ok) {
            error.value = "Failed to ignore device";
            return;
          }
          device.is_ignored = true;
          selected.value = null;
        };

        return { devices, showIgnored, visibleDevices, loading, error, selected, onIgnore };
      },
    }).mount("#app");
  </script>
</body>
</html>
